<div
  class="main-layout min-h-screen"
  [class.main-layout--home]="isHomePage"
  [class.main-layout--salon-detail]="isSalonDetailPage"
  [class.main-layout--search]="isSearchPage"
  [class.main-layout--no-header]="!showHeader"
  [class.main-layout--no-footer]="!showFooter"
  [style.--footer-reveal-height.px]="showFooter ? footerRevealHeight() : 0"
>
  @if (isHomePage) {
    <div class="home-hero-bg" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
  }

  @if (showHeader) {
    <div class="main-layout__header">
      <app-header class="site-header"></app-header>
    </div>
  }

  <div class="main-layout__content page-surface">
    <main class="main-layout__main flex-grow flex flex-col w-full pt-6">
      <router-outlet></router-outlet>
    </main>
  </div>

  @if (showFooter) {
    <div #footerRevealLayer class="footer-reveal-layer">
      <app-footer></app-footer>
    </div>
  }
</div>
