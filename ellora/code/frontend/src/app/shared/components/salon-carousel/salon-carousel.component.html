<section class="max-w-7xl mx-auto w-full px-6 pb-20 pt-8">
  @if (animateHeader) {
    <div class="flex items-center justify-between mb-8" appRevealOnScroll="fade-up" [revealDistance]="24">
      <h2 class="font-bold text-2xl text-brand-darker tracking-tight">{{ title }}</h2>
      <a [routerLink]="viewAllLink" [queryParams]="viewAllQueryParams" class="text-sm font-semibold text-brand hover:text-brand-darker transition-colors" appRevealOnScroll="fade" [revealDelay]="60">Xem tất cả</a>
    </div>
  } @else {
    <div class="flex items-center justify-between mb-8">
      <h2 class="font-bold text-2xl text-brand-darker tracking-tight">{{ title }}</h2>
      <a [routerLink]="viewAllLink" [queryParams]="viewAllQueryParams" class="text-sm font-semibold text-brand hover:text-brand-darker transition-colors">Xem tất cả</a>
    </div>
  }
  
  <div class="relative group">
    <div #scrollContainer class="flex overflow-x-auto gap-6 pb-6 snap-x snap-proximity hide-scrollbar scroll-smooth" style="scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; overscroll-behavior-inline: contain;">
      <!-- style hack for webkit in next line -->
      <style> .hide-scrollbar::-webkit-scrollbar { display: none; } </style>
      
      @for (salon of salons; track salon.id; let index = $index) {
        @if (animateCards) {
          <div class="w-[85vw] sm:w-[calc(50%-12px)] lg:w-[calc(25%-18px)] shrink-0 snap-start" appRevealOnScroll="fade-up" [revealDelay]="index > 3 ? 180 : index * 60" [revealDistance]="18">
            <app-salon-card [salon]="salon" variant="home" class="block h-full"></app-salon-card>
          </div>
        } @else {
          <div class="w-[85vw] sm:w-[calc(50%-12px)] lg:w-[calc(25%-18px)] shrink-0 snap-start">
            <app-salon-card [salon]="salon" variant="home" class="block h-full"></app-salon-card>
          </div>
        }
      }
    </div>

    <!-- Navigation Arrows -->
    @if (canScrollLeft()) {
      <button type="button" aria-label="Cuộn salon sang trái" (click)="scrollLeft()" class="absolute left-0 top-[40%] -translate-y-1/2 -ml-4 w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-brand-darker hover:text-brand transition-colors border border-brand-darker/10 z-10 hidden md:flex">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
      </button>
    }
    @if (canScrollRight()) {
      <button type="button" aria-label="Cuộn salon sang phải" (click)="scrollRight()" class="absolute right-0 top-[40%] -translate-y-1/2 -mr-4 w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-brand-darker hover:text-brand transition-colors border border-brand-darker/10 z-10 hidden md:flex">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
      </button>
    }
  </div>
</section>
